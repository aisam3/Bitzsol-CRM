<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Extension Diagnostic – Bitzsol Lead Extractor</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          monospace;
        background: #0f172a;
        padding: 24px;
        color: #e2e8f0;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
        background: #1e293b;
        border-radius: 24px;
        padding: 24px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      }
      h1 {
        font-size: 1.8rem;
        margin-bottom: 8px;
      }
      .sub {
        color: #94a3b8;
        margin-bottom: 24px;
        border-bottom: 1px solid #334155;
        padding-bottom: 12px;
      }
      .card {
        background: #0f172a;
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 20px;
      }
      .card h2 {
        font-size: 1.3rem;
        margin-bottom: 16px;
        color: #facc15;
      }
      button {
        background: #3b82f6;
        border: none;
        padding: 8px 16px;
        border-radius: 30px;
        color: white;
        font-weight: 500;
        cursor: pointer;
        margin-right: 12px;
      }
      button:hover {
        background: #2563eb;
      }
      pre {
        background: #0f172a;
        padding: 12px;
        border-radius: 12px;
        overflow-x: auto;
        font-size: 12px;
        margin-top: 12px;
        border: 1px solid #334155;
      }
      .status {
        margin-top: 12px;
        padding: 8px;
        border-radius: 8px;
      }
      .pass {
        color: #4ade80;
      }
      .fail {
        color: #f87171;
      }
      .warning {
        color: #facc15;
      }
      hr {
        margin: 16px 0;
        border-color: #334155;
      }
      .flex {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🔧 Bitzsol Lead Extractor – Diagnostic Tool</h1>
      <div class="sub">
        Check settings, test APIs, and verify extension health
      </div>

      <div class="card">
        <h2>📦 1. Stored Settings</h2>
        <div id="settingsDisplay">Loading...</div>
        <div class="flex" style="margin-top: 12px">
          <button id="refreshSettingsBtn">⟳ Refresh</button>
          <button id="clearSettingsBtn" style="background: #ef4444">
            🗑 Clear All Settings
          </button>
        </div>
      </div>

      <div class="card">
        <h2>🔌 2. Apify Connection Test</h2>
        <button id="testApifyBtn">Test Apify Token</button>
        <div id="apifyResult" class="status"></div>
      </div>

      <div class="card">
        <h2>🍪 3. LinkedIn Cookie Check</h2>
        <button id="testCookieBtn">Check li_at Cookie</button>
        <div id="cookieResult" class="status"></div>
      </div>

      <div class="card">
        <h2>📤 4. Simulated Extraction (No real API call)</h2>
        <button id="simulateExtractBtn">Simulate Lead Extraction</button>
        <div id="simulateResult" class="status"></div>
      </div>

      <hr />
      <div class="sub" style="text-align: center">
        Use this page to debug issues before using the main extension.
      </div>
    </div>

    <script>
      // Helper to show settings
      async function displaySettings() {
        const div = document.getElementById("settingsDisplay");
        const items = await chrome.storage.sync.get([
          "apifyToken",
          "apifyActorId",
          "apolloKey",
          "useApollo",
          "crmEndpoint",
          "crmToken",
          "darkMode",
        ]);
        const masked = { ...items };
        if (masked.apifyToken)
          masked.apifyToken = masked.apifyToken.slice(0, 8) + "••••";
        if (masked.apolloKey)
          masked.apolloKey = masked.apolloKey.slice(0, 6) + "••••";
        if (masked.crmToken)
          masked.crmToken = masked.crmToken.slice(0, 6) + "••••";
        div.innerHTML = `<pre>${JSON.stringify(masked, null, 2)}</pre>`;
      }

      // Clear all settings
      async function clearSettings() {
        if (
          confirm("⚠️ This will delete all API keys and settings. Proceed?")
        ) {
          await chrome.storage.sync.clear();
          await displaySettings();
          alert("Settings cleared. Reload extension or reopen options.");
        }
      }

      // Test Apify token
      async function testApify() {
        const resultDiv = document.getElementById("apifyResult");
        const { apifyToken } = await chrome.storage.sync.get("apifyToken");
        if (!apifyToken) {
          resultDiv.innerHTML =
            '<span class="fail">❌ No Apify token found in storage. Set it in options.html.</span>';
          return;
        }
        resultDiv.innerHTML = "⏳ Testing...";
        try {
          const response = await fetch(
            `https://api.apify.com/v2/acts?token=${apifyToken}`,
          );
          if (response.ok) {
            const data = await response.json();
            resultDiv.innerHTML = `<span class="pass">✅ Apify token is valid! Found ${data.data?.total || 0} actors.</span>`;
          } else {
            const err = await response.text();
            resultDiv.innerHTML = `<span class="fail">❌ Invalid token or API error (${response.status}): ${err.slice(0, 100)}</span>`;
          }
        } catch (e) {
          resultDiv.innerHTML = `<span class="fail">❌ Network error: ${e.message}</span>`;
        }
      }

      // Check LinkedIn cookie
      async function checkLinkedInCookie() {
        const resultDiv = document.getElementById("cookieResult");
        try {
          const cookie = await chrome.cookies.get({
            url: "https://www.linkedin.com",
            name: "li_at",
          });
          if (cookie && cookie.value) {
            resultDiv.innerHTML = `<span class="pass">✅ li_at cookie found. Value: ${cookie.value.slice(0, 10)}... (length ${cookie.value.length})</span>`;
          } else {
            resultDiv.innerHTML = `<span class="fail">❌ No li_at cookie. Please log into LinkedIn in this browser.</span>`;
          }
        } catch (err) {
          resultDiv.innerHTML = `<span class="fail">❌ Error reading cookie: ${err.message}. Check "cookies" permission in manifest.</span>`;
        }
      }

      // Simulate extraction (calls background with a dummy URL to test flow)
      async function simulateExtraction() {
        const resultDiv = document.getElementById("simulateResult");
        resultDiv.innerHTML =
          "⏳ Simulating... (will use a test LinkedIn profile URL)";
        const testUrl = "https://www.linkedin.com/in/satyanadella/";
        try {
          const response = await new Promise((resolve, reject) => {
            chrome.runtime.sendMessage(
              { action: "extractLinkedinLead", url: testUrl },
              (resp) => {
                if (chrome.runtime.lastError)
                  reject(new Error(chrome.runtime.lastError.message));
                else resolve(resp);
              },
            );
          });
          if (response && response.success) {
            resultDiv.innerHTML = `<span class="pass">✅ Simulation successful. Background script responded with lead data: ${JSON.stringify(response.data).slice(0, 200)}...</span>`;
          } else {
            resultDiv.innerHTML = `<span class="fail">❌ Simulation failed: ${response?.error || "No response"}</span>`;
          }
        } catch (err) {
          resultDiv.innerHTML = `<span class="fail">❌ Error: ${err.message}</span>`;
        }
      }

      // Event listeners
      document
        .getElementById("refreshSettingsBtn")
        .addEventListener("click", displaySettings);
      document
        .getElementById("clearSettingsBtn")
        .addEventListener("click", clearSettings);
      document
        .getElementById("testApifyBtn")
        .addEventListener("click", testApify);
      document
        .getElementById("testCookieBtn")
        .addEventListener("click", checkLinkedInCookie);
      document
        .getElementById("simulateExtractBtn")
        .addEventListener("click", simulateExtraction);

      displaySettings();
    </script>
  </body>
</html>
