<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Extension Settings – Bitzsol Lead Extractor</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --bg: #ffffff;
        --surface: #f8fafc;
        --text: #0f172a;
        --text-secondary: #475569;
        --border: #e2e8f0;
        --primary: #0a66c2;
        --primary-hover: #004182;
        --success: #16a34a;
        --danger: #dc2626;
      }
      body.dark {
        --bg: #0f172a;
        --surface: #1e293b;
        --text: #f1f5f9;
        --text-secondary: #94a3b8;
        --border: #334155;
        --primary: #3b82f6;
        --primary-hover: #60a5fa;
        --success: #22c55e;
        --danger: #ef4444;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        padding: 24px;
        transition:
          background 0.2s,
          color 0.2s;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
        margin-bottom: 8px;
      }
      h1 {
        font-size: 1.8rem;
        font-weight: 600;
      }
      .sub {
        color: var(--text-secondary);
        margin-bottom: 32px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 12px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 24px;
        margin-bottom: 24px;
      }
      .card h2 {
        font-size: 1.4rem;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .form-group {
        margin-bottom: 20px;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
      }
      input,
      select {
        width: 100%;
        padding: 10px 14px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        color: var(--text);
        font-size: 14px;
        transition: 0.2s;
      }
      input:focus,
      select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(10, 102, 194, 0.2);
      }
      .flex-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 8px;
      }
      button {
        background: var(--primary);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 30px;
        font-weight: 500;
        cursor: pointer;
        transition: 0.2s;
      }
      button:hover {
        background: var(--primary-hover);
      }
      button.secondary {
        background: var(--text-secondary);
      }
      .status {
        margin-top: 16px;
        padding: 12px;
        border-radius: 12px;
        font-size: 14px;
        display: none;
      }
      .status.success {
        background: var(--success);
        color: white;
        display: block;
      }
      .status.error {
        background: var(--danger);
        color: white;
        display: block;
      }
      .theme-switch {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      hr {
        margin: 16px 0;
        border-color: var(--border);
      }
      .footer-note {
        font-size: 12px;
        color: var(--text-secondary);
        text-align: center;
        margin-top: 32px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>⚙️ Bitzsol Lead Extractor</h1>
        <div class="theme-switch">
          <span>🌓 Dark Mode</span>
          <label style="display: flex; align-items: center; gap: 8px">
            <input type="checkbox" id="darkModeToggle" />
          </label>
        </div>
      </div>
      <div class="sub">Configure API keys and enrichment settings</div>

      <!-- Apify -->
      <div class="card">
        <h2>📦 Apify Scraper</h2>
        <div class="form-group">
          <label>Apify API Token *</label>
          <input
            type="password"
            id="apifyToken"
            placeholder="apify_api_xxxxxx"
            autocomplete="off"
          />
        </div>
        <div class="form-group">
          <label>Apify Actor ID</label>
          <input
            type="text"
            id="apifyActorId"
            placeholder="7W"
            autocomplete="off"
          />
        </div>
      </div>

      <!-- Apollo -->
      <div class="card">
        <h2>🔍 Apollo.io Enrichment (optional)</h2>
        <div class="form-group">
          <label>Apollo API Key</label>
          <input
            type="password"
            id="apolloKey"
            placeholder="Your Apollo API key"
            autocomplete="off"
          />
        </div>
        <div class="form-group">
          <label>Use Apollo enrichment?</label>
          <select id="useApollo">
            <option value="yes">Yes, enrich with Apollo</option>
            <option value="no">No, skip enrichment</option>
          </select>
        </div>
      </div>

      <!-- Bitzsol CRM -->
      <div class="card">
        <h2>🏢 Bitzsol CRM</h2>
        <div class="form-group">
          <label>CRM API Endpoint</label>
          <input
            type="url"
            id="crmEndpoint"
            placeholder="https://api.bitzsol.com/v1/leads"
            autocomplete="off"
          />
        </div>
        <div class="form-group">
          <label>CRM API Token (Bearer)</label>
          <input
            type="password"
            id="crmToken"
            placeholder="Your CRM token"
            autocomplete="off"
          />
        </div>
      </div>

      <div class="flex-row">
        <button id="saveBtn">💾 Save All Settings</button>
        <button id="testBtn" class="secondary">🔌 Test Apify Connection</button>
      </div>
      <div id="statusMsg" class="status"></div>
      <hr />
      <div class="footer-note">
        ✅ Settings are stored locally in chrome.storage.sync.<br />
        🌙 Dark mode preference is saved automatically.<br />
        * Apify token is required for extraction.
      </div>
    </div>

    <script>
      // DOM elements
      const apifyTokenInp = document.getElementById("apifyToken");
      const apifyActorInp = document.getElementById("apifyActorId");
      const apolloKeyInp = document.getElementById("apolloKey");
      const useApolloSelect = document.getElementById("useApollo");
      const crmEndpointInp = document.getElementById("crmEndpoint");
      const crmTokenInp = document.getElementById("crmToken");
      const darkToggle = document.getElementById("darkModeToggle");
      const saveBtn = document.getElementById("saveBtn");
      const testBtn = document.getElementById("testBtn");
      const statusDiv = document.getElementById("statusMsg");

      // Load saved settings
      async function loadSettings() {
        const res = await chrome.storage.sync.get([
          "apifyToken",
          "apifyActorId",
          "apolloKey",
          "useApollo",
          "crmEndpoint",
          "crmToken",
          "darkMode",
        ]);
        apifyTokenInp.value = res.apifyToken || "";
        apifyActorInp.value = res.apifyActorId || "7W";
        apolloKeyInp.value = res.apolloKey || "";
        useApolloSelect.value = res.useApollo === "no" ? "no" : "yes";
        crmEndpointInp.value =
          res.crmEndpoint || "https://api.bitzsol.com/v1/leads";
        crmTokenInp.value = res.crmToken || "";
        // Dark mode
        if (res.darkMode === "dark") {
          document.body.classList.add("dark");
          darkToggle.checked = true;
        } else {
          document.body.classList.remove("dark");
          darkToggle.checked = false;
        }
      }

      // Save all settings
      async function saveSettings() {
        const settings = {
          apifyToken: apifyTokenInp.value.trim(),
          apifyActorId: apifyActorInp.value.trim(),
          apolloKey: apolloKeyInp.value.trim(),
          useApollo: useApolloSelect.value,
          crmEndpoint: crmEndpointInp.value.trim(),
          crmToken: crmTokenInp.value.trim(),
          darkMode: document.body.classList.contains("dark") ? "dark" : "light",
        };
        await chrome.storage.sync.set(settings);
        showStatus("✅ Settings saved successfully!", "success");
        // Notify background script that settings changed
        chrome.runtime
          .sendMessage({ action: "settingsUpdated" })
          .catch(() => {});
      }

      // Test Apify token
      async function testApifyConnection() {
        const token = apifyTokenInp.value.trim();
        if (!token) {
          showStatus("❌ Please enter an Apify token first.", "error");
          return;
        }
        showStatus("⏳ Testing Apify API...", "info", true);
        try {
          const response = await fetch(
            `https://api.apify.com/v2/acts?token=${token}`,
          );
          if (response.ok) {
            showStatus(
              "✅ Apify token is valid! You can now extract leads.",
              "success",
            );
          } else {
            const errText = await response.text();
            showStatus(
              `❌ Invalid token or API error (${response.status}): ${errText.slice(0, 100)}`,
              "error",
            );
          }
        } catch (err) {
          showStatus(`❌ Network error: ${err.message}`, "error");
        }
      }

      function showStatus(msg, type, keepForSeconds = 3) {
        statusDiv.textContent = msg;
        statusDiv.className = `status ${type}`;
        setTimeout(() => {
          if (statusDiv.className.includes(type)) {
            statusDiv.style.display = "none";
            statusDiv.className = "status";
          }
        }, keepForSeconds * 1000);
        statusDiv.style.display = "block";
      }

      // Dark mode toggle
      darkToggle.addEventListener("change", (e) => {
        if (e.target.checked) {
          document.body.classList.add("dark");
        } else {
          document.body.classList.remove("dark");
        }
        chrome.storage.sync.set({
          darkMode: document.body.classList.contains("dark") ? "dark" : "light",
        });
      });

      saveBtn.addEventListener("click", saveSettings);
      testBtn.addEventListener("click", testApifyConnection);

      loadSettings();
    </script>
  </body>
</html>
