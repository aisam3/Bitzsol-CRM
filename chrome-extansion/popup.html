<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bitzsol CRM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }

    .header {
      background: linear-gradient(135deg, #1e40af, #3b82f6);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header h1 {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.3px;
    }

    .header .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      flex-shrink: 0;
    }

    .body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Profile card — hidden until data loads */
    #profile-card {
      display: none;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      gap: 6px;
      flex-direction: column;
    }

    #profile-card.visible { display: flex; }

    #profile-name {
      font-size: 14px;
      font-weight: 600;
      color: #f1f5f9;
    }

    #profile-headline {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
    }

    #profile-url {
      font-size: 11px;
      color: #3b82f6;
      word-break: break-all;
    }

    /* Status / log area */
    #status {
      font-size: 12px;
      color: #94a3b8;
      min-height: 18px;
      text-align: center;
    }

    #status.error  { color: #f87171; }
    #status.success { color: #22c55e; }
    #status.loading { color: #facc15; }

    /* Button */
    #syncBtn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #1e40af, #3b82f6);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    #syncBtn:hover:not(:disabled) { opacity: 0.9; }
    #syncBtn:active:not(:disabled) { transform: scale(0.98); }
    #syncBtn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Pipeline selector */
    #pipelineId,
    #pipelineSelect {
      width: 100%;
      padding: 8px 10px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 13px;
      outline: none;
    }

    #pipelineId:focus,
    #pipelineSelect:focus { border-color: #3b82f6; }

    #pipelineSelect option { background: #1e293b; }

    label {
      font-size: 11px;
      color: #64748b;
      margin-bottom: -6px;
    }

    .hint {
      font-size: 11px;
      color: #475569;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="dot"></div>
    <h1>Bitzsol CRM</h1>
  </div>

  <div class="body">
    <!-- Profile preview (shown after scraping) -->
    <div id="profile-card">
      <div id="profile-name"></div>
      <div id="profile-headline"></div>
      <div id="profile-url"></div>
    </div>

    <!-- Status / log line -->
    <div id="status">Open a LinkedIn profile to sync</div>

    <!-- Pipeline selector -->
    <label for="pipelineSelect">Pipeline</label>
    <select id="pipelineSelect">
      <option value="">Loading pipelines…</option>
    </select>

    <!-- Sync button -->
    <button id="syncBtn">Sync Lead</button>

    <div class="hint">Must be on a linkedin.com/in/… page</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
